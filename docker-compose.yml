services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recsys_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./deploy:/app/deploy
    env_file:
      - .env
    environment:
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
    healthcheck:
      test: [ "CMD", "python", "-c", "import http.client; conn = http.client.HTTPConnection('localhost:8000'); conn.request('GET', '/api/health'); exit(0 if conn.getresponse().status == 200 else 1)" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 1G

  frontend:
    build:
      context: "./frontend/Music Recommender"
      dockerfile: Dockerfile
    container_name: recsys_frontend
    restart: unless-stopped
    ports:
      - "8075:80"
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
