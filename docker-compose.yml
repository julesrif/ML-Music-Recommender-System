  services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recsys_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Montaje de solo lectura para los artefactos de Machine Learning
      - ../models:/app/models:ro
      - ../cache:/app/cache:ro
    environment:
      # Límite estricto para evitar colapso de recursos en inferencia CPU
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: recsys_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
  deploy:
      resources:
        limits:
          memory: 128M

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: recsys_tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TOKEN}
